<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand-Drip Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none; }
        .mobile-frame { width: 393px; height: 852px; border: 8px solid #333; border-radius: 3rem; overflow: hidden; position: relative; background: #fdfbf7; }
        .coffee-brown { background-color: #4b3621; }
    </style>
</head>
<body class="bg-gray-200 flex justify-center items-center min-h-screen">

    <div class="mobile-frame shadow-2xl flex flex-col font-sans">
        
        <div id="screen-select" class="flex-1 flex flex-col p-8">
            <h1 class="mt-20 text-3xl font-bold text-gray-800 mb-2">어떤 커피를<br>내리시나요?</h1>
            <p class="text-gray-500 mb-10 text-sm">최적의 핸드드립 레시피를 제안합니다.</p>
            
            <div class="grid gap-4">
                <button onclick="setDrink('Americano')" class="p-8 border-2 border-amber-900 rounded-3xl text-left hover:bg-amber-50 transition-all">
                    <span class="text-2xl font-bold block">Americano</span>
                    <span class="text-xs text-amber-800">깔끔하고 부드러운 추출</span>
                </button>
                <button onclick="setDrink('Latte')" class="p-8 border-2 border-amber-900 rounded-3xl text-left hover:bg-amber-50 transition-all">
                    <span class="text-2xl font-bold block">Latte</span>
                    <span class="text-xs text-amber-800">진한 커피 에센스 추출</span>
                </button>
            </div>
        </div>

        <div id="screen-option" class="hidden flex-1 flex flex-col p-8">
            <button onclick="showScreen('screen-select')" class="mt-12 text-gray-400">← 뒤로가기</button>
            <h2 id="selected-title" class="text-2xl font-bold mt-4 mb-10 text-amber-900"></h2>
            
            <div class="space-y-8">
                <div>
                    <p class="font-bold mb-3">온도 설정</p>
                    <div class="flex gap-2">
                        <button onclick="setMode('Hot')" id="btn-hot" class="flex-1 py-3 border rounded-xl font-bold">HOT</button>
                        <button onclick="setMode('Ice')" id="btn-ice" class="flex-1 py-3 border rounded-xl font-bold">ICE</button>
                    </div>
                </div>

                <div>
                    <p class="font-bold mb-3">잔 수</p>
                    <div class="flex items-center justify-between bg-white p-4 rounded-xl border">
                        <button onclick="changeCups(-1)" class="text-2xl font-bold px-4">-</button>
                        <span id="cup-count" class="text-xl font-bold">1잔</span>
                        <button onclick="changeCups(1)" class="text-2xl font-bold px-4">+</button>
                    </div>
                </div>
            </div>

            <button onclick="calculateRecipe()" class="mt-auto mb-10 w-full py-4 coffee-brown text-white rounded-2xl font-bold shadow-lg">레시피 확인</button>
        </div>

        <div id="screen-result" class="hidden flex-1 flex flex-col p-8">
            <h2 class="mt-16 text-2xl font-bold text-amber-900 mb-6 text-center italic underline">Today's Brew Guide</h2>
            
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-white p-4 rounded-2xl border text-center">
                    <p class="text-[10px] text-gray-400">분쇄도</p>
                    <p id="res-grind" class="text-xl font-bold"></p>
                </div>
                <div class="bg-white p-4 rounded-2xl border text-center">
                    <p class="text-[10px] text-gray-400">물 온도</p>
                    <p class="text-xl font-bold text-red-500">95°C</p>
                </div>
                <div class="bg-white p-4 rounded-2xl border text-center">
                    <p class="text-[10px] text-gray-400">원두 양</p>
                    <p id="res-beans" class="text-xl font-bold"></p>
                </div>
                <div class="bg-white p-4 rounded-2xl border text-center">
                    <p class="text-[10px] text-gray-400">총 추출량</p>
                    <p id="res-total" class="text-xl font-bold text-blue-600"></p>
                </div>
            </div>

            <div class="p-6 bg-amber-50 rounded-3xl border-2 border-dashed border-amber-200">
                <p class="text-sm font-bold text-amber-900 mb-2">📌 가이드</p>
                <ul class="text-xs space-y-2 text-amber-800">
                    <li>1. 95도의 물로 30g 부어 뜸을 들입니다.</li>
                    <li>2. 커피 에센스를 충분히 추출하세요.</li>
                    <li>3. 목표 추출량에 도달하면 드리퍼를 제거합니다.</li>
                </ul>
            </div>

            <button onclick="location.reload()" class="mt-auto mb-10 w-full py-4 border-2 border-gray-200 rounded-2xl text-gray-400 font-bold">처음으로</button>
        </div>

    </div>

    <script>
        let config = { drink: '', mode: '', cups: 1 };

        function showScreen(id) {
            ['screen-select', 'screen-option', 'screen-result'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function setDrink(d) {
            config.drink = d;
            document.getElementById('selected-title').innerText = d === 'Americano' ? "Americano Recipe" : "Latte Recipe";
            showScreen('screen-option');
        }

        function setMode(m) {
            config.mode = m;
            document.getElementById('btn-hot').className = m === 'Hot' ? 'flex-1 py-3 bg-red-500 text-white rounded-xl font-bold' : 'flex-1 py-3 border rounded-xl font-bold';
            document.getElementById('btn-ice').className = m === 'Ice' ? 'flex-1 py-3 bg-blue-500 text-white rounded-xl font-bold' : 'flex-1 py-3 border rounded-xl font-bold';
        }

        function changeCups(n) {
            config.cups = Math.max(1, config.cups + n);
            document.getElementById('cup-count').innerText = config.cups + "잔";
        }

        function calculateRecipe() {
            if(!config.mode) return alert("온도를 선택해주세요!");
            
            let grind, beans, total;
            const { drink, mode, cups } = config;

            if (drink === 'Americano') {
                grind = "4.5 ~ 5.0";
                beans = (mode === 'Hot' ? 18 + (cups-1)*10 : 20 + (cups-1)*10) + "g";
                total = (170 + (cups-1)*10) + " ~ " + (180 + (cups-1)*10) + "g";
            } else {
                grind = "2.0 ~ 2.5";
                if(mode === 'Hot') {
                    beans = (23 + (cups-1)*10) + "g";
                    total = (90 + (cups-1)*10) + " ~ 100g";
                } else {
                    beans = "60g"; // Ice Latte 기준 고정
                    total = "200 ~ 210g";
                }
            }

            document.getElementById('res-grind').innerText = grind;
            document.getElementById('res-beans').innerText = beans;
            document.getElementById('res-total').innerText = total;
            showScreen('screen-result');
        }
    </script>
</body>
</html>

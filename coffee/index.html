<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand-Drip Master v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8f5f2; }
        .hidden { display: none; }
        .mobile-frame { 
            width: 393px; height: 852px; 
            background: #ffffff; 
            border-radius: 40px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .active-btn {
            background-color: #4b3621 !important;
            color: white !important;
            transform: scale(1.02);
        }
        /* 페이드 인 애니메이션 */
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen">

    <div class="mobile-frame flex flex-col">
        
        <div id="screen-select" class="fade-in flex-1 flex flex-col p-8">
            <div class="mt-16 mb-12">
                <span class="text-amber-700 font-bold text-sm tracking-widest uppercase">Barista Guide</span>
                <h1 class="text-4xl font-black text-gray-900 leading-tight mt-2">Perfect<br>Hand-Drip</h1>
            </div>
            
            <div class="space-y-4">
                <button onclick="setDrink('Americano')" class="w-full p-6 bg-gray-50 rounded-3xl text-left border border-transparent hover:border-amber-200 transition-all group">
                    <div class="flex justify-between items-center">
                        <div>
                            <span class="text-2xl font-bold block text-gray-800">Americano</span>
                            <span class="text-sm text-gray-500">깔끔한 본연의 맛</span>
                        </div>
                        <span class="text-2xl group-hover:translate-x-1 transition-transform">→</span>
                    </div>
                </button>
                <button onclick="setDrink('Latte')" class="w-full p-6 bg-gray-50 rounded-3xl text-left border border-transparent hover:border-amber-200 transition-all group">
                    <div class="flex justify-between items-center">
                        <div>
                            <span class="text-2xl font-bold block text-gray-800">Latte</span>
                            <span class="text-sm text-gray-500">우유와 어우러지는 진한 에센스</span>
                        </div>
                        <span class="text-2xl group-hover:translate-x-1 transition-transform">→</span>
                    </div>
                </button>
            </div>
        </div>

        <div id="screen-option" class="hidden fade-in flex-1 flex flex-col p-8">
            <button onclick="showScreen('screen-select')" class="mt-12 text-gray-400 font-medium">✕ Close</button>
            <h2 id="selected-title" class="text-3xl font-black mt-6 mb-10 text-gray-900"></h2>
            
            <div class="space-y-10">
                <section>
                    <p class="text-xs font-bold text-amber-800 tracking-tighter mb-4 uppercase">Step 1. Temperature</p>
                    <div class="flex p-1 bg-gray-100 rounded-2xl">
                        <button onclick="setMode('Hot')" id="btn-hot" class="flex-1 py-4 rounded-xl font-bold text-gray-500 transition-all">HOT</button>
                        <button onclick="setMode('Ice')" id="btn-ice" class="flex-1 py-4 rounded-xl font-bold text-gray-500 transition-all">ICE</button>
                    </div>
                </section>

                <section>
                    <p class="text-xs font-bold text-amber-800 tracking-tighter mb-4 uppercase">Step 2. Servings</p>
                    <div class="flex items-center justify-between bg-white p-2 rounded-2xl border-2 border-gray-100">
                        <button onclick="changeCups(-1)" class="w-12 h-12 flex items-center justify-center bg-gray-50 rounded-xl text-xl font-bold hover:bg-gray-100">-</button>
                        <span id="cup-count" class="text-2xl font-black text-gray-800">1 Cup</span>
                        <button onclick="changeCups(1)" class="w-12 h-12 flex items-center justify-center bg-gray-50 rounded-xl text-xl font-bold hover:bg-gray-100">+</button>
                    </div>
                </section>
            </div>

            <button onclick="calculateRecipe()" class="mt-auto mb-10 w-full py-5 bg-gray-900 text-white rounded-2xl font-bold text-lg shadow-xl active:scale-95 transition-all">
                Create Recipe
            </button>
        </div>

        <div id="screen-result" class="hidden fade-in flex-1 flex flex-col bg-gray-900 text-white p-8">
            <div class="mt-16 text-center">
                <p class="text-amber-500 font-bold tracking-widest text-xs uppercase mb-2">Brewing Guide</p>
                <h2 id="res-title" class="text-2xl font-bold mb-10"></h2>
            </div>
            
            <div class="grid grid-cols-2 gap-3 mb-10">
                <div class="bg-white/10 p-5 rounded-3xl border border-white/10">
                    <p class="text-[10px] text-gray-400 mb-1 uppercase">Grind Size</p>
                    <p id="res-grind" class="text-xl font-black text-amber-400"></p>
                </div>
                <div class="bg-white/10 p-5 rounded-3xl border border-white/10">
                    <p class="text-[10px] text-gray-400 mb-1 uppercase">Temp</p>
                    <p class="text-xl font-black">95°C</p>
                </div>
                <div class="bg-white/10 p-5 rounded-3xl border border-white/10">
                    <p class="text-[10px] text-gray-400 mb-1 uppercase">Coffee</p>
                    <p id="res-beans" class="text-xl font-black text-amber-400"></p>
                </div>
                <div class="bg-white/10 p-5 rounded-3xl border border-white/10">
                    <div class="flex justify-between items-start">
                        <p class="text-[10px] text-gray-400 mb-1 uppercase">Extraction</p>
                    </div>
                    <p id="res-total" class="text-xl font-black"></p>
                </div>
            </div>

            <div class="space-y-4 mb-10">
                <div class="flex gap-4 items-start">
                    <span class="w-6 h-6 rounded-full bg-amber-500 text-gray-900 flex items-center justify-center text-[10px] font-bold shrink-0">1</span>
                    <p class="text-sm text-gray-300">95도의 물 30g을 부어 30초간 뜸을 들입니다.</p>
                </div>
                <div class="flex gap-4 items-start">
                    <span class="w-6 h-6 rounded-full bg-amber-500 text-gray-900 flex items-center justify-center text-[10px] font-bold shrink-0">2</span>
                    <p class="text-sm text-gray-300">중심에서 바깥으로 원을 그리며 부드럽게 추출하세요.</p>
                </div>
            </div>

            <button onclick="location.reload()" class="mt-auto mb-10 w-full py-4 border border-white/20 rounded-2xl text-gray-400 font-bold hover:bg-white/5 transition-all">
                Reset
            </button>
        </div>

    </div>

    <script>
        let config = { drink: '', mode: '', cups: 1 };

        function showScreen(id) {
            ['screen-select', 'screen-option', 'screen-result'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function setDrink(d) {
            config.drink = d;
            document.getElementById('selected-title').innerText = d;
            showScreen('screen-option');
        }

        function setMode(m) {
            config.mode = m;
            document.getElementById('btn-hot').className = m === 'Hot' ? 'flex-1 py-4 rounded-xl font-bold active-btn' : 'flex-1 py-4 rounded-xl font-bold text-gray-500 hover:bg-gray-200 transition-all';
            document.getElementById('btn-ice').className = m === 'Ice' ? 'flex-1 py-4 rounded-xl font-bold active-btn' : 'flex-1 py-4 rounded-xl font-bold text-gray-500 hover:bg-gray-200 transition-all';
        }

        function changeCups(n) {
            config.cups = Math.max(1, config.cups + n);
            document.getElementById('cup-count').innerText = config.cups + " Cup" + (config.cups > 1 ? "s" : "");
        }

        function calculateRecipe() {
            if(!config.mode) return alert("Please select Hot or Ice!");
            
            let grind, beans, total;
            const { drink, mode, cups } = config;

            if (drink === 'Americano') {
                grind = "4.5 ~ 5.0";
                beans = (mode === 'Hot' ? 18 + (cups-1)*10 : 20 + (cups-1)*10) + "g";
                total = (170 + (cups-1)*10) + " ~ " + (180 + (cups-1)*10) + "g";
            } else {
                grind = "2.0 ~ 2.5";
                if(mode === 'Hot') {
                    beans = (23 + (cups-1)*10) + "g";
                    total = (90 + (cups-1)*10) + " ~ 100g";
                } else {
                    beans = "60g"; 
                    total = "200 ~ 210g";
                }
            }

            document.getElementById('res-title').innerText = mode + " " + drink;
            document.getElementById('res-grind').innerText = grind;
            document.getElementById('res-beans').innerText = beans;
            document.getElementById('res-total').innerText = total;
            showScreen('screen-result');
        }
    </script>
</body>
</html>
